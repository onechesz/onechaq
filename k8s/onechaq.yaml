apiVersion: v1
kind: Service
metadata:
  name: onechaq-postgres
spec:
  type: ExternalName
  externalName: host.docker.internal
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  type: ExternalName
  externalName: host.docker.internal
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  type: ExternalName
  externalName: host.docker.internal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onechaq
spec:
  replicas: 2
  selector:
    matchLabels:
      app: onechaq
  template:
    metadata:
      labels:
        app: onechaq
    spec:
      containers:
        - name: onechaq
          image: onechaq:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: CHAT_GROUP_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: onechaq
spec:
  type: LoadBalancer
  selector:
    app: onechaq
  ports:
    - port: 8080
      targetPort: 8080
