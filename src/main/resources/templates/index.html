<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>onechaq</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
    <h1>Сообщения</h1>
    <p>Онлайн: <span id="online">{online}</span></p>
    <div id="messages">
        {#for message in messages}
            <p class="mb-2">{message.body}</p>
        {#else}
            <p id="empty" class="mb-2">В базе пока нет строк</p>
        {/for}
    </div>
    <form id="composer" class="mt-4">
        <label for="body" class="visually-hidden">Сообщение</label>
        <div class="input-group">
            <input id="body" class="form-control" maxlength="255" autocomplete="off">
            <button class="btn btn-primary" type="submit">Отправить</button>
        </div>
    </form>
</main>
<script src="/chat.js"></script>
</body>
</html>
